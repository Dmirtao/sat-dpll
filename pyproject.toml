[build-system]
# Specify your preferred backend: "setuptools.build_meta", "hatchling.build_meta", or "flit_core.buildapi"
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sat-dpll"
version = "0.1.0"
description = "A basic SAT solver implementing DPLL + heuristics."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Andras Karsai", email = "your.email@example.com"},
    {name = "Oraefo Onwuta", email = "your.email@example.com"}
]
dependencies = [
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
